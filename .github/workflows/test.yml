name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 两个仓库并排检出——这就是本地的默认开发布局，也是不需要 submodule
      # 的原因。一致性测试按 ../doubak-data-specs 定位规范仓库。
      - uses: actions/checkout@v4
        with:
          path: doubak-data-parser

      - uses: actions/checkout@v4
        with:
          repository: Doubak/doubak-data-specs
          path: doubak-data-specs

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 跑测试
        working-directory: doubak-data-parser
        run: npm test

      # **换一个时区再跑一遍。**
      #
      # 这条是被真事逼出来的：一条断言写死了本地时区下的时刻，本地全绿、CI 全红
      # ——而那是运气好，CI 恰好在 UTC。要是 CI 也在同一个时区，这个 bug 会一直
      # 潜到某个用户那里才炸。
      #
      # 用 UTC+14 是因为它与任何常见时区都差得足够远，日期本身都会不同。
      - name: 换个时区再跑一遍
        working-directory: doubak-data-parser
        env:
          TZ: Pacific/Kiritimati
        run: npm test

      # 覆盖率用 Node 自带的，不装任何东西；上传是 curl 打 Coveralls 的
      # /jobs 端点，用 repo token 认证。**不引 coverallsapp/github-action**：
      # 它只认 github-token，还要把 @coveralls 以 Role: Write 请进仓库。
      #
      # 只在 push 上跑：fork 来的 PR 拿不到 secrets，那时脚本会硬失败（它故意
      # 不静默跳过），在 PR 上就成了一个和代码无关的红叉。
      #
      # **排除项只有 test/** 一条，而且是量出来的，不是随手加的**：排除项会烂掉，
      # 越少越好。曾经还排了 tools/**，那是反射性动作——coveralls.mjs 现在自己
      # 有测试，排掉等于把一个测过的文件藏起来，去掉后 11 → 12 个文件、98.52%
      # → 96.35%，低的那个才是真的。
      #
      # test/** 留着，两个原因，都实测过：测试文件按定义就是 ~100%，算进去只会
      # 把总数拖向 100% 并盖住 src 里的窟窿；而且**完全不排除时这一步跑不完**
      # ——120 秒还没结束，排除后是 1 秒。
      #
      # 真正该担心的遗漏不是这里写着的这一条，而是**没写出来的那些**：
      # 从没被任何测试 import 的文件根本不进分母（本仓库的 bin/parse.js 就是），
      # 它们不是 0%，是压根不存在。显式的排除项至少还看得见。
      - name: 覆盖率 → Coveralls
        if: github.event_name == 'push'
        working-directory: doubak-data-parser
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
        run: |
          node --test --experimental-test-coverage \
            --test-coverage-exclude='test/**' \
            --test-reporter=lcov --test-reporter-destination=lcov.info \
            --test-reporter=dot --test-reporter-destination=stdout \
            "test/**/*.test.js"
          node tools/coveralls.mjs lcov.info

      # 本地跑时若规范仓库不在场，一致性用例会「带原因跳过」。
      # 跳过在本地合理，在 CI 里等于没测——所以显式确认它们真的跑了。
      - name: 确认一致性用例确实跑了而不是跳过了
        working-directory: doubak-data-parser
        run: |
          test -d ../doubak-data-specs/canonical/tests/cases || {
            echo '::error::规范仓库缺失，一致性用例会静默跳过'; exit 1; }
          n=$(ls ../doubak-data-specs/canonical/tests/cases | wc -l)
          echo "一致性用例 $n 组"
          test "$n" -ge 10 || { echo '::error::用例数不对，像是没检出全'; exit 1; }

      # 解析器的一部分测试要对着真实档案跑，而真实档案是私人数据，不会进 CI。
      # 它们会跳过——**跳过多少要说出来**，否则「全绿」会掩盖「一大半没跑」。
      - name: 报告跳过了多少
        working-directory: doubak-data-parser
        run: npm test 2>&1 | grep -E '^ℹ (tests|pass|skipped)' || true
